[package]
name = "bobtop-db"
description = "TUI database browser (Postgres + DuckDB / DuckLake) built on the gtui toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bobtop-db"
path = "src/bin/bobtop-db.rs"

[dependencies]
gtui = { workspace = true }
# gfb owns the Connection trait + Postgres / DuckDB / DuckLake
# backends as of Phase 4. bobtop-db is dissolving into gfb in Phase 6
# but still ships its own binary for now, so we pull all backends in
# unconditionally.
gfb = { workspace = true, features = ["all-sources"] }

ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }

[features]
default = []
# Mirror gfb's feature gates so bobtop-db's `conn::pg` /
# `conn::duck` re-exports compile when downstream callers ask for
# them. The transitional design pulls them in by default via
# the `gfb = { features = ["all-sources"] }` line above.
postgres = ["gfb/postgres"]
duckdb = ["gfb/duckdb"]
