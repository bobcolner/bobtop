[package]
name = "bobtop-pid-attr"
description = "Tiered per-process kernel attribution for gtop — network and disk I/O via eBPF / libpcap / /proc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

# Optional: Tier 2 — userspace packet capture.
pcap = { workspace = true, optional = true }

# Tier 3 — eBPF userspace loader. Linux-only at the source level; gating on
# `cfg(target_os = "linux")` keeps macOS builds clean even when the `ebpf`
# feature is requested by mistake.
[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = { workspace = true, optional = true }

# libbpf-cargo runs at build time to compile BPF C → ELF object and
# generate typed Rust skeletons. Build-deps run on the *host*, so this
# is fine to leave un-target-gated; the feature flag still controls
# whether it gets compiled at all.
[build-dependencies]
libbpf-cargo = { workspace = true, optional = true }

[features]
default = []
pcap = ["dep:pcap"]
ebpf = ["dep:libbpf-rs", "dep:libbpf-cargo"]
