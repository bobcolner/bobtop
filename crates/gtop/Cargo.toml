[package]
name = "gtop"
description = "btop-flavoured TUI system monitor: CPU, memory, network, disk, processes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "gtop"
path = "src/lib.rs"

[[bin]]
name = "gtop"
path = "src/main.rs"

[dependencies]
bobtop-core = { workspace = true }
bobtop-collectors = { workspace = true }
bobtop-pid-attr = { workspace = true }
bobtop-engine = { workspace = true }
gtui = { workspace = true }
# gfb is folded into the gtop binary as a `gtop fb …` subcommand when
# the default `fb` feature is on. Build with `--no-default-features
# --features ebpf` to drop the file browser entirely (saves ~5 MB of
# binary size + the syntect/image/viuer/notify/trash dep tree).
gfb = { workspace = true, optional = true }

tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
libc = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "render_loop"
harness = false

[features]
# eBPF on by default — build.rs in bobtop-pid-attr gracefully no-ops when
# clang/libbpf-dev aren't present, so gtop still builds on bare-bones
# systems; it just falls through to Tier 2/1 attribution at runtime.
#
# `fb` folds gfb into the binary so `gtop fb …` works and the `b`
# keybind opens the file browser as a subprocess of the same
# executable. Opt out with `--no-default-features --features ebpf` for
# a leaner monitor-only build.
default = ["ebpf", "fb"]
ebpf = ["bobtop-pid-attr/ebpf"]
pcap = ["bobtop-pid-attr/pcap"]
fb = ["dep:gfb"]
