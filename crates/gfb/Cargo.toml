[package]
name = "gfb"
description = "Yazi-style TUI file (and DB) browser built on the gtui toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gfb"
path = "src/bin/gfb.rs"

[dependencies]
gtui = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
unicode-width = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# Preview pipeline. `default-fancy` swaps the C/onig regex engine for a
# pure-Rust fancy-regex backend so we don't introduce a libonig system
# dep into the workspace.
syntect = { version = "5", default-features = false, features = ["default-fancy", "default-syntaxes", "default-themes"] }
lru = "0.12"
globset = { workspace = true }
pulldown-cmark = { version = "0.10", default-features = false }
# Image decoding for the preview pipeline. Limit to formats users
# actually browse — the full feature flag pulls TIFF/HDR/etc. that we
# don't need and add ~1 MB to the binary.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Live refresh — watch the cwd so file changes show up without
# manual `r`. We only need a "something changed" signal, so the
# default backend (inotify on Linux, kqueue on macOS) is fine.
notify = "6"
# XDG Trash on Linux, ~/.Trash on macOS, Recycle Bin on Windows.
# Used by `d` so deletion is recoverable; hard `rm` is gated behind
# Shift-D + a confirm modal.
trash = "5"
# Native image protocols (kitty / iTerm / sixel). We use viuer's
# protocol detection but only call it when a real bitmap protocol
# is available — otherwise we keep our sextant-block path, which
# looks better than viuer's own half-block fallback.
viuer = { version = "0.9", default-features = false, features = ["print-file"] }

# Optional DB backends — feature-gated so a default `cargo install gfb`
# doesn't pull tokio-postgres / duckdb (and ~30 MB of build cost).
# `cargo build --features all-sources` enables both.
tokio-postgres = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:tokio-postgres"]
duckdb = ["dep:duckdb"]
all-sources = ["postgres", "duckdb"]
