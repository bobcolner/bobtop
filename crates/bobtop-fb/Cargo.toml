[package]
name = "bobtop-fb"
description = "Yazi-style TUI file browser built on bobtop-tui widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bobtop-fb"
path = "src/bin/bobtop-fb.rs"

[dependencies]
bobtop-tui = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
unicode-width = { workspace = true }

# Preview pipeline. `default-fancy` swaps the C/onig regex engine for a
# pure-Rust fancy-regex backend so we don't introduce a libonig system
# dep into the workspace.
syntect = { version = "5", default-features = false, features = ["default-fancy", "default-syntaxes", "default-themes"] }
lru = "0.12"
globset = { workspace = true }
pulldown-cmark = { version = "0.10", default-features = false }
# Image decoding for the preview pipeline. Limit to formats users
# actually browse — the full feature flag pulls TIFF/HDR/etc. that we
# don't need and add ~1 MB to the binary.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
