[workspace]
resolver = "2"
members = [
    "crates/bobtop-core",
    "crates/bobtop-collectors",
    "crates/bobtop-pid-attr",
    "crates/bobtop-tui",
    "crates/bobtop-daemon",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bobcolner/bobtop"
authors = ["bobtop contributors"]

[workspace.dependencies]
# First-party crates (path-resolved within the workspace)
bobtop-core = { path = "crates/bobtop-core" }
bobtop-collectors = { path = "crates/bobtop-collectors" }
bobtop-pid-attr = { path = "crates/bobtop-pid-attr" }
bobtop-tui = { path = "crates/bobtop-tui" }

# TUI rendering
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# System data sources
sysinfo = "0.32"
pcap = "2.0"
nvml-wrapper = "0.10"
libc = "0.2"

# eBPF userspace loader. We use libbpf-rs (a safe Rust wrapper around the
# canonical libbpf C library) instead of pure-Rust loaders like aya:
# libbpf is the reference implementation maintained alongside the kernel,
# so it tracks ELF/BTF format changes correctly across LLVM versions.
# Migrated from aya 0.13.1 after persistent "error parsing ELF data"
# failures on hosts where the BPF object was perfectly valid (the issue
# was aya's from-scratch ELF parser, not the object).
libbpf-rs = "0.26"
# Build-time codegen: SkeletonBuilder compiles bpf .c → .o and emits
# typed Rust accessors for programs and maps.
libbpf-cargo = "0.26"

# Errors & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
