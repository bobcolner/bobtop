[workspace]
resolver = "2"
members = [
    "crates/gtui",
    "crates/gtop",
    "crates/gfb",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bobcolner/gverse"
authors = ["gtop contributors"]

[workspace.dependencies]
# First-party crates. Both `path` (dev) and `version` (publish) —
# `cargo publish` strips the path when packaging and pins the
# crates.io version we declare here.
gtui = { path = "crates/gtui", version = "0.3.0" }
gfb = { path = "crates/gfb", version = "0.3.0" }

# TUI rendering
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Postgres client (used by gfb's `postgres` feature)
tokio-postgres = "0.7"

# DuckDB client (used by gfb's `duckdb` feature). `bundled` builds libduckdb from
# source so we don't depend on a system install — first compile is
# slow (~2-3 min) but every subsequent build is incremental.
#
# We tried `default-features = false` to drop Arrow; arrow turned
# out to be a hard dep of the duckdb-rs crate (not feature-gated),
# so disabling defaults was a no-op. Leaving on the defaults.
duckdb = { version = "1.4", features = ["bundled"] }

# System data sources
sysinfo = "0.32"
pcap = "2.0"
libc = "0.2"

# eBPF userspace loader. We use libbpf-rs (a safe Rust wrapper around the
# canonical libbpf C library) instead of pure-Rust loaders like aya:
# libbpf is the reference implementation maintained alongside the kernel,
# so it tracks ELF/BTF format changes correctly across LLVM versions.
# Migrated from aya 0.13.1 after persistent "error parsing ELF data"
# failures on hosts where the BPF object was perfectly valid (the issue
# was aya's from-scratch ELF parser, not the object).
libbpf-rs = "0.26"
# Build-time codegen: SkeletonBuilder compiles bpf .c → .o and emits
# typed Rust accessors for programs and maps.
libbpf-cargo = "0.26"

# Errors & logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
regex = "1"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
